<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#58cc02">
<title>이탈리아 회화 플래시카드 · Day 1</title>
<style>
:root{
  --g:#58cc02; --gd:#46a302; --g-t:#d7ffb8;
  --b:#1cb0f6; --bd:#1899d6; --b-t:#ddf4ff;
  --r:#ff4b4b; --rd:#d33131; --r-t:#ffdfe0;
  --y:#ffc800; --ink:#3c3c3c; --sub:#8a8a8a; --line:#e6e6e6; --soft:#f7f7f7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#eef2ea;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;
}
button{font-family:inherit;cursor:pointer}
.app{
  max-width:480px;margin:0 auto;background:#fff;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;box-shadow:0 0 40px rgba(30,50,20,.07);
}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:2px solid #eee;padding:10px 16px 12px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.hd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;letter-spacing:-.4px}
.tri{
  width:24px;height:17px;border-radius:4px;border:1px solid rgba(0,0,0,.07);flex:0 0 auto;
  background:linear-gradient(90deg,#5e7f55 0 33.3%,#f7f2e4 33.3% 66.6%,#b8503a 66.6% 100%);
}
.brand small{font-size:11px;font-weight:800;color:#a5a5a5;letter-spacing:0;margin-left:2px}
.icon-btn{
  border:0;background:#f3f3f3;border-radius:12px;width:44px;height:44px;font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{background:#e8e8e8}
.tabs{display:flex;background:#f1f1f1;border-radius:14px;padding:4px;gap:4px}
.tab{
  flex:1;border:0;background:transparent;padding:12px 6px;border-radius:11px;min-height:44px;
  font-size:14px;font-weight:800;color:#8f8f8f;letter-spacing:-.2px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 0 #e3e3e3,0 1px 4px rgba(0,0,0,.05)}

/* ---------- layout ---------- */
main{flex:1;padding:14px 16px calc(30px + env(safe-area-inset-bottom))}
.view{display:none}
.view.active{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- day chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:44px;
  border:2px solid var(--line);background:#fff;border-radius:999px;
  padding:9px 13px;font-size:12.5px;font-weight:800;color:#8a8a8a;letter-spacing:-.2px;
}
.chip .n{font-size:11px;font-weight:800;background:rgba(0,0,0,.055);border-radius:999px;padding:2px 6px;color:#9a9a9a}
.chip.active{border-color:var(--g);background:var(--g-t);color:#417f00}
.chip.active .n{background:#fff;color:#5aa000}
.chip.soon{border-style:dashed;color:#c2c2c2;background:#fcfcfc}

/* ---------- progress ---------- */
.statrow{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.bar{flex:1;height:14px;background:#ebebeb;border-radius:999px;overflow:hidden}
.bar>i{
  display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(180deg,#7ee02b,#58cc02);
  transition:width .35s cubic-bezier(.2,.8,.2,1);
}
.stat{font-size:11.5px;font-weight:800;color:#9a9a9a;white-space:nowrap}

/* ---------- filters ---------- */
.filters{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{
  flex:0 0 auto;border:2px solid #efefef;background:#fff;border-radius:999px;min-height:42px;
  padding:9px 13px;font-size:12px;font-weight:800;color:#a2a2a2;letter-spacing:-.2px;
}
.fchip.active{border-color:#dcdcdc;background:#f4f4f4;color:#3c3c3c}

/* ---------- flash card ---------- */
.card{
  position:relative;background:#fff;border:2px solid #e9e9e9;border-radius:22px;
  box-shadow:0 4px 0 #ededed;padding:48px 18px 44px;min-height:352px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  cursor:pointer;transition:transform .1s;
}
.card:active{transform:translateY(2px);box-shadow:0 2px 0 #ededed}
.badge{
  position:absolute;top:14px;left:14px;font-size:10.5px;font-weight:800;letter-spacing:-.1px;
  padding:6px 10px;border-radius:999px;background:#eef7e4;color:#4e8a08;
}
.badge.en{background:#e7f5ff;color:#0d7bb8}
.badge.word{background:#fff4d6;color:#a97400}
.front,.back{width:100%;display:none;flex-direction:column;align-items:center;gap:12px}
.card:not(.flipped) .front{display:flex}
.card.flipped .back{display:flex}
.hint{position:absolute;bottom:13px;left:0;right:0;font-size:11px;font-weight:700;color:#bdbdbd}
.card.flipped .hint{display:none}

.big{font-size:30px;line-height:1.24;font-weight:800;letter-spacing:-.7px;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.big.md{font-size:23px;letter-spacing:-.4px;line-height:1.28}
.big.sm{font-size:18.5px;letter-spacing:-.2px;line-height:1.4}
.pron{display:inline-block;background:#fdeee3;color:#b04a22;font-weight:800;font-size:16.5px;padding:8px 14px;border-radius:12px;letter-spacing:-.2px}
.pron.small{font-size:13px;padding:5px 10px;border-radius:9px}
.ko{font-size:26px;font-weight:800;line-height:1.32;letter-spacing:-.6px;word-break:keep-all}
.ko.sm{font-size:19px;letter-spacing:-.3px;line-height:1.4}
.engline{font-size:12.5px;font-weight:700;color:#a0a0a0;line-height:1.45}
.tipbox{
  width:100%;background:var(--soft);border-radius:14px;padding:12px 14px;
  font-size:13px;line-height:1.55;font-weight:600;color:#666;text-align:left;
}
.tipbox b{color:#3c3c3c}

/* 단어 뜻 쪼개기 · 같이 외울 파생 표현 */
.bdbox{
  width:100%;background:#f8fbf2;border:2px solid #e6f0d8;border-radius:14px;
  padding:9px 11px 10px;display:flex;flex-direction:column;gap:6px;text-align:left;
}
.bdhead{font-size:10.5px;font-weight:800;color:#5f9a1f;letter-spacing:-.1px}
.bdwrap{display:flex;flex-wrap:wrap;gap:5px}
.bdpill{
  display:inline-flex;align-items:baseline;gap:5px;background:#fff;border:1.5px solid #dce9c9;
  border-radius:999px;padding:4px 9px;font-size:12px;line-height:1.25;letter-spacing:-.2px;max-width:100%;
}
.bdpill b{font-weight:800;color:#3f7d00}
.bdpill i{font-style:normal;font-weight:700;color:#8f8f8f;font-size:11.5px}
.relbox{
  width:100%;background:#fff9ee;border:2px solid #f7e7cb;border-radius:14px;
  padding:9px 11px 10px;display:flex;flex-direction:column;gap:6px;text-align:left;
}
.relhead{font-size:10.5px;font-weight:800;color:#b0762a;letter-spacing:-.1px}
.relwrap{display:flex;flex-wrap:wrap;gap:5px}
.relpill{
  display:inline-flex;align-items:baseline;gap:5px;background:#fff;border:1.5px solid #f0dcb8;
  border-radius:999px;padding:4px 9px;font-size:12px;line-height:1.25;letter-spacing:-.2px;max-width:100%;
}
.relpill b{font-weight:800;color:#8a5b12}
.relpill i{font-style:normal;font-weight:700;color:#a9906a;font-size:11.5px}

/* 예시문 박스 */
.exbox{
  width:100%;background:#f3f9ff;border:2px solid #d9eefb;border-radius:14px;
  padding:11px 12px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;
}
.exlabel{font-size:10.5px;font-weight:800;color:#0d7bb8;letter-spacing:-.1px}
.extext{font-size:14.5px;line-height:1.44;font-weight:800;color:#22404f;word-break:keep-all;overflow-wrap:anywhere}
.expron{font-size:12px;font-weight:800;color:#b0762a;line-height:1.35;letter-spacing:-.1px}
.exko{font-size:12.5px;font-weight:700;color:#7b8d98;line-height:1.42;word-break:keep-all}
.exrow{display:flex;gap:7px;margin-top:5px;flex-wrap:wrap}
.exsay{
  display:inline-flex;align-items:center;gap:6px;border:2px solid #b7e6fc;background:#fff;
  color:#0d7bb8;border-radius:11px;padding:8px 11px;font-size:12px;font-weight:800;
  min-height:38px;box-shadow:0 2px 0 #dcefff;letter-spacing:-.2px;
}
.exsay:active{transform:translateY(2px);box-shadow:none}
.exsay.slow{color:#8a8a8a;border-color:#e8e8e8;box-shadow:0 2px 0 #ececec}
.sayrow{display:flex;gap:10px;align-items:center;margin-top:2px}
.say{
  border:0;width:56px;height:56px;border-radius:50%;font-size:23px;line-height:1;
  background:var(--b-t);color:#0d7bb8;border:2px solid #b7e6fc;box-shadow:0 3px 0 #b7e6fc;
  display:flex;align-items:center;justify-content:center;
}
.say:active{transform:translateY(2px);box-shadow:0 1px 0 #b7e6fc}
.say.slow{width:44px;height:44px;font-size:17px;background:#fff;color:#9a9a9a;border-color:#e8e8e8;box-shadow:0 3px 0 #ececec}

/* ---------- nav & answers ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 12px}
.navbtn{border:0;background:transparent;padding:10px 8px;min-height:44px;font-size:13.5px;font-weight:800;color:#9a9a9a}
.navbtn:disabled{color:#d6d6d6}
.pos{font-size:12.5px;font-weight:800;color:#a5a5a5}
.answers{display:flex;gap:10px}
.btn{
  flex:1;border:0;border-radius:16px;padding:16px 6px;font-size:15px;font-weight:800;letter-spacing:-.3px;
  transition:transform .08s;
}
.btn:active{transform:translateY(3px)}
.btn.again{background:#ffefc2;color:#a97400;box-shadow:0 4px 0 #e8c972}
.btn.known{background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd)}
.btn.ghost{background:#f4f4f4;color:#7a7a7a;box-shadow:0 4px 0 #e6e6e6}

/* ---------- done / empty ---------- */
.donebox{text-align:center;padding:26px 8px}
.donebox .emoji{font-size:46px;line-height:1}
.dtitle{font-size:21px;font-weight:800;letter-spacing:-.6px;margin:10px 0 6px}
.dsub{font-size:13px;font-weight:700;color:#9a9a9a;line-height:1.55;margin-bottom:18px}
.donebox .btn{width:100%;margin-bottom:10px}

/* ---------- quiz ---------- */
.qstart{text-align:center;padding:8px 2px 0}
.qcenter{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 220px);min-height:calc(100dvh - 220px)}
.qemoji{font-size:46px;line-height:1}
.qtitle{font-size:23px;font-weight:800;letter-spacing:-.7px;margin:8px 0 8px}
.qdesc{font-size:13.5px;line-height:1.6;font-weight:600;color:#8f8f8f}
.qstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.qstat{background:var(--soft);border-radius:14px;padding:12px 4px}
.qstat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px}
.qstat span{font-size:10.5px;font-weight:800;color:#a5a5a5}
.scope-note{font-size:11.5px;font-weight:700;color:#b0b0b0;margin:14px 0 0}
.mixline{
  margin-top:14px;font-size:11.5px;font-weight:800;color:#8f8f8f;background:#f7f7f7;
  border-radius:12px;padding:11px 12px;line-height:1.5;
}

.qhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.qhead .bar{height:12px}
.combo{
  font-size:12.5px;font-weight:800;color:#e07b00;background:#fff5e0;border-radius:999px;
  padding:4px 9px;opacity:0;transition:opacity .2s;white-space:nowrap;
}
.combo.on{opacity:1}
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.qtag{
  display:inline-block;font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:999px;
  background:#e7f5ff;color:#0d7bb8;letter-spacing:-.1px;
}
.qcount{font-size:12px;font-weight:800;color:#a5a5a5}
.qprompt{
  font-size:21px;font-weight:800;line-height:1.35;letter-spacing:-.5px;margin:8px 0 12px;
  word-break:keep-all;overflow-wrap:anywhere;
}
.qprompt.md{font-size:17px;line-height:1.45}
.qprompt.sm{font-size:15px;line-height:1.5}
.qsub{font-size:13px;font-weight:700;color:#9a9a9a;margin:0 0 10px;line-height:1.45}
.qstart .btn{width:100%;margin-top:10px;flex:0 0 auto}
.audio-btn{
  display:inline-flex;align-items:center;gap:9px;background:var(--b-t);color:#0d7bb8;
  border:2px solid #b7e6fc;box-shadow:0 3px 0 #b7e6fc;border-radius:14px;
  padding:12px 16px;font-size:13.5px;font-weight:800;margin-bottom:14px;
}
.audio-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b7e6fc}
.peek{border:0;background:transparent;font-size:12px;font-weight:800;color:#a5a5a5;text-decoration:underline;padding:8px 0;min-height:36px;margin:-6px 0 10px;display:block}
.bubble{
  display:flex;align-items:flex-start;gap:10px;background:#f7f7f7;border-radius:16px;padding:12px 14px;margin-bottom:12px;
}
.bubble .who{font-size:11px;font-weight:800;color:#8a8a8a;white-space:nowrap;padding-top:2px}
.bubble .saytxt{font-size:14px;font-weight:800;color:#4a4a4a;line-height:1.4}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:#fff;border:2px solid var(--line);border-radius:14px;box-shadow:0 2px 0 #eee;
  padding:13px 13px;font-size:15px;font-weight:700;line-height:1.4;color:var(--ink);min-height:56px;
  transition:transform .07s;
}
.opt:active{transform:translateY(2px)}
.opt .k{
  flex:0 0 auto;width:24px;height:24px;border-radius:8px;border:2px solid #e2e2e2;
  font-size:11px;font-weight:800;color:#bcbcbc;display:flex;align-items:center;justify-content:center;
}
.opt.long{font-size:13px;line-height:1.45}
.opt.sel{border-color:var(--b);background:var(--b-t);box-shadow:0 2px 0 #8fd6f8;color:#0d6fa8}
.opt.sel .k{border-color:var(--b);color:#0d6fa8}
.opt.ok{border-color:var(--g);background:var(--g-t);box-shadow:0 2px 0 #a5e46a;color:#3f7d00}
.opt.ok .k{background:var(--g);border-color:var(--g);color:#fff}
.opt.no{border-color:var(--r);background:var(--r-t);box-shadow:0 2px 0 #f0a3a3;color:#b8241c}
.opt.no .k{background:var(--r);border-color:var(--r);color:#fff}
.checkbtn{
  width:100%;margin-top:14px;border:0;border-radius:16px;padding:16px;font-size:15px;font-weight:800;
  background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd);letter-spacing:-.3px;
}
.checkbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gd)}
.checkbtn[disabled]{background:#e9e9e9;color:#b0b0b0;box-shadow:0 4px 0 #dedede;transform:none}

.fb{margin-top:14px;border-radius:18px;padding:14px;display:none}
.fb.show{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--g-t)}
.fb.no{background:var(--r-t)}
.fb h4{margin:0 0 7px;font-size:16.5px;font-weight:800;letter-spacing:-.4px}
.fb.ok h4{color:#3f7d00}
.fb.no h4{color:#b8241c}
.fb p{margin:0 0 5px;font-size:13px;line-height:1.55;font-weight:600;color:#4f4f4f;word-break:keep-all;overflow-wrap:anywhere}
.fb p:last-of-type{margin-bottom:0}
.fb .go{
  width:100%;margin-top:12px;border:0;border-radius:14px;padding:14px;font-size:14.5px;font-weight:800;color:#fff;
}
.fb.ok .go{background:var(--g);box-shadow:0 3px 0 var(--gd)}
.fb.no .go{background:var(--r);box-shadow:0 3px 0 #b8241c}

.bigscore{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1;margin:8px 0 4px}
.bigscore small{font-size:20px;color:#b0b0b0;letter-spacing:-.5px}
.wronglist{text-align:left;margin:18px 0 6px;border-top:2px dashed #eee;padding-top:14px}
.wronglist .wt{font-size:12px;font-weight:800;color:#b0b0b0;margin-bottom:8px}
.wrongitem{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.wrongitem .q{font-size:12px;font-weight:700;color:#8a8a8a;line-height:1.4;margin-bottom:3px}
.wrongitem .a{font-size:13px;font-weight:800;color:#3f7d00;line-height:1.4}

.note{font-size:11px;line-height:1.6;color:#b8b8b8;font-weight:600;text-align:center;margin-top:18px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  background:#3c3c3c;color:#fff;padding:12px 18px;border-radius:14px;font-size:12.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:.22s;z-index:80;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:360px){
  .big{font-size:26px}
  .big.md{font-size:21px}
  .big.sm{font-size:17px}
  .ko{font-size:23px}
  .card{padding:44px 14px 42px;min-height:330px}
  .qprompt{font-size:19px}
  .opt{font-size:14px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hd-top">
      <div class="brand"><span class="tri"></span>이탈리아 회화 <small id="brandDay">DAY 1</small></div>
      <button class="icon-btn" id="soundBtn" aria-label="효과음 켜기/끄기">🔊</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" id="tabFlash" role="tab">🗂 플래시카드</button>
      <button class="tab" id="tabQuiz" role="tab">⚡ 퀴즈</button>
    </div>
  </header>

  <main>
    <!-- ================= FLASHCARD ================= -->
    <section class="view active" id="viewFlash">
      <div class="chips" id="dayChips"></div>
      <div class="statrow">
        <div class="bar"><i id="flashBar"></i></div>
        <div class="stat" id="flashStat"></div>
      </div>
      <div class="filters" id="flashFilters"></div>
      <div id="flashBody"></div>
      <div class="note">Day 2가 추가되면 여기에 자동으로 쌓여요 · 복습 상태는 이 기기에 저장</div>
    </section>

    <!-- ================= QUIZ ================= -->
    <section class="view" id="viewQuiz">
      <div id="quizBody"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   1) 학습 데이터 — Day 2, Day 3 … 는 이 배열에 객체 하나만 더하면 끝.
      (플래시카드 · Day 필터 · 전체 복습 · 퀴즈 문제은행에 자동으로 쌓입니다)

   card 필드
     id     : 고유 id (복습 상태 저장 키)
     type   : 'it' 이탈리아어 | 'en' 영어 | 'word' 단어
     tag    : 카드 위 작은 라벨 (인사 / 입국심사 / 단어 …)
     front  : 앞면에 크게 나오는 원문
     pron   : 한글 발음 (이탈리아어만)
     ko     : 한국어 뜻 (뒷면 · 퀴즈 정답)

const $ = (s, r) => (r||document).querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
let toastTimer = null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");

}

/* ---------- 소리 ---------- */
let audioCtx = null;
function beep(kind){
  if(!store.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const seq = kind === "ok" ? [[660,0],[880,.07],[1180,.14]] : [[300,0],[210,.11]];
    seq.forEach(([f,d])=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t+d);
      g.gain.linearRampToValueAtTime(.05, t+d+.012);
      g.gain.exponentialRampToValueAtTime(.0001, t+d+.15);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t+d); o.stop(t+d+.17);
    });
  }catch(e){}
}

/* ---------- 발음 ---------- */
let voices = [];
function loadVoices(){ try{ voices = window.speechSynthesis ? (speechSynthesis.getVoices()||[]) : []; }catch(e){ voices = []; } }
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.addEventListener("voiceschanged", loadVoices);
}
function pickVoice(lang){
  const want = lang.toLowerCase().replace("_","-");
  const base = want.split("-")[0];
  let v = voices.find(x => (x.lang||"").toLowerCase().replace("_","-") === want);
  if(!v) v = voices.find(x => (x.lang||"").toLowerCase().replace("_","-").indexOf(base) === 0);
  return v || null;
}
function speak(text, lang, rate){
  if(!window.speechSynthesis || !text) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "it-IT";
    u.rate = rate || 1;
    u.pitch = 1;
    const v = pickVoice(u.lang);
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 원어민 MP3 재생 (있으면 MP3, 없거나 실패하면 위 TTS로 폴백) ----------
   · 파일: audio/{카드 id}.mp3  (예: audio/d1it01.mp3)
   · iOS 사파리는 사용자 터치 핸들러 안에서 곧바로 play()를 불러야 소리가 나요.
   · 🐢 느리게 듣기는 <audio> 자체 배속(playbackRate)으로 처리 — iOS에서도 확실히 동작. */
const AUDIO_BASE = "audio/";
const audioEls = {};
let playingEl = null;
function cardLang(c){ return c && c.type === "en" ? "en-US" : "it-IT"; }
function audioEl(id){
  if(!id) return null;
  let a = audioEls[id];
  if(!a){
    try{
      a = new Audio();
      a.preload = "auto";
      a.src = AUDIO_BASE + id + ".mp3";
      audioEls[id] = a;
    }catch(e){ return null; }
  }
  return a;
}
function prefetchAudio(ids){
  (ids || []).forEach(id => { if(id && !audioEls[id]) audioEl(id); });
}
function stopAudio(){
  if(playingEl){ try{ playingEl.pause(); playingEl.currentTime = 0; }catch(e){} playingEl = null; }
}
function playAudio(id, text, lang, rate){
  rate = rate || 1;
  stopAudio();
  const a = id ? audioEl(id) : null;
  if(!a){ speak(text, lang, rate); return; }
  let fellBack = false;
  const fallback = () => {
    if(fellBack) return;
    fellBack = true;
    try{ a.pause(); }catch(e){}
    if(playingEl === a) playingEl = null;
    speak(text, lang, rate);
  };
  const applyRate = () => { try{ a.defaultPlaybackRate = rate; a.playbackRate = rate; }catch(e){} };
  a.onerror = fallback;
  a.onended = () => { if(playingEl === a) playingEl = null; };
  a.onloadedmetadata = applyRate;
  a.onplaying = applyRate;
  try{ a.currentTime = 0; }catch(e){}
  applyRate();
  playingEl = a;
  let p = null;
  try{ p = a.play(); }catch(e){ fallback(); return; }
  if(p && p.then) p.then(applyRate).catch(() => { if(playingEl === a) fallback(); });
}
function questionAudioId(q){
  if(!q) return "";
  if(q.kind === "qa") return String(q.cardId || "").replace(/^qa:/, "");
  return (q.src && q.src.id) || "";
}
function playQuestionAudio(q){
  if(!q || !q.audio) return;
  playAudio(questionAudioId(q), q.audio.text, q.audio.lang, 1);
}

/* =====================================================================

   ===================================================================== */
function pickDistractors(answer, pool, n){
  const A = String(answer);
  const L = A.length;
  const seen = {}; seen[A] = 1;
  const near = [], far = [];
  shuffle(pool).forEach(t=>{
    if(!t || seen[t]) return;
    seen[t] = 1;
    if(t.length >= L*0.45 - 2 && t.length <= L*1.8 + 8) near.push(t);
    else far.push(t);
  });
  return near.concat(far).slice(0, n);
}
function mkOptions(correct, distractors){
  return shuffle([{text:correct, correct:true}].concat(distractors.map(t=>({text:t, correct:false}))));
}
function kindLabel(q){
  if(q.kind==="meaning") return "뜻 맞히기";
  if(q.kind==="reverse") return "말해 보기";
  if(q.kind==="listen") return "듣기";
  if(q.kind==="qa") return "리스닝 · 대답";
  return q.tag || "상황";
}
function buildPool(){
  const days = scopeDays();
  const cards = days.reduce((a,d)=>a.concat(d.cards.map(c=>Object.assign({day:d.day}, c))), []);
  const qas = days.reduce((a,d)=>a.concat((d.qa||[]).map(q=>Object.assign({day:d.day}, q))), []);
  const extras = days.reduce((a,d)=>a.concat((d.extra||[]).map(q=>Object.assign({day:d.day}, q))), []);
  const qs = [];
  const allKo = cards.map(c=>c.ko);
  const koByType = {it:[], en:[], word:[]};
  cards.forEach(c=>{ (koByType[c.type] || koByType.it).push(c.ko); });
  const frontIt = cards.filter(c=>c.type==="it").map(c=>c.front);
  const frontWord = cards.filter(c=>c.type==="word").map(c=>c.front);
  const frontEn = cards.filter(c=>c.type==="en").map(c=>c.front);

  cards.forEach(c=>{
    const base = {day:c.day, cardId:c.id, tag:c.tag, src:c};
    /* 뜻 맞히기 */
    qs.push(Object.assign({}, base, {
      kind:"meaning",
      prompt:c.front,
      audio:{text:c.front, lang:c.type==="en"?"en-US":"it-IT"},
      ask:c.type==="word" ? "이 단어, 무슨 뜻일까요?" : "무슨 뜻일까요?",
      options:mkOptions(c.ko, pickDistractors(c.ko, (koByType[c.type]||[]).concat(allKo), 3)),
      explain:[].concat(
        c.pron ? ["발음 · "+c.pron] : [],
        (c.en && c.type!=="en") ? [c.en] : [],
        bdLine(c),
        c.tip ? [c.tip] : []
      )
    }));
    /* 반대 방향 */
    if(c.rev !== false){
      const pool = c.type==="en" ? frontEn : (c.type==="word" ? frontWord : frontIt);
      qs.push(Object.assign({}, base, {
        kind:"reverse",
        prompt:c.ko,
        ask:c.type==="en" ? "영어로 뭐라고 할까요?" : "이탈리아어로 뭐라고 할까요?",
        options:mkOptions(c.front, pickDistractors(c.front, pool, 3)),
        explain:[].concat(
          c.pron ? ["발음 · "+c.pron] : [],
          bdLine(c),
          c.tip ? [c.tip] : []
        ),
        answerNote:c.front
      }));
    }
    /* 듣기 */
    qs.push(Object.assign({}, base, {
      kind:"listen",
      prompt:"",
      audio:{text:c.front, lang:c.type==="en"?"en-US":"it-IT"},
      ask:"듣고 뜻을 고르세요",
      options:mkOptions(c.ko, pickDistractors(c.ko, (koByType[c.type]||[]).concat(allKo), 3)),
      explain:[].concat(
        ["들린 문장 · "+c.front],
        c.pron ? ["발음 · "+c.pron] : [],
        bdLine(c),
        c.tip ? [c.tip] : []
      ),
      transcript:c.front
    }));
  });

  qas.forEach(q=>{
    qs.push({
      day:q.day, cardId:"qa:"+q.id, tag:"리스닝", kind:"qa",
      speaker:q.speaker,
      audio:{text:q.q, lang:"it-IT"},
      ask:"질문을 듣고 알맞은 대답을 고르세요",
      options:mkOptions(q.a, pickDistractors(q.a, qas.map(x=>x.a).concat(frontIt), 3)),
      explain:[
        "«"+q.q+"» — "+q.qKo,
        "«"+q.a+"» — "+q.aKo+" ("+q.aPron+")",
        q.tip
      ],
      qKo:q.qKo,
      answerNote:q.a
    });
  });

  extras.forEach(q=>{
    qs.push({
      day:q.day, cardId:"ex:"+q.id, tag:q.tag||"상황", kind:"extra",
      prompt:q.q, ask:"", audio:null,
      options:shuffle(q.options.map((t,i)=>({text:t, correct:i===q.a}))),
      explain:[q.explain]
    });
  });

  return qs;
}
function pickRound(pool, n){
  const groups = {}, order = [];
  pool.forEach(q=>{
    if(!groups[q.kind]){ groups[q.kind] = []; order.push(q.kind); }
    groups[q.kind].push(q);
  });
  order.forEach(k=>{ groups[k] = shuffle(groups[k]); });
  const weights = {meaning:3, listen:3, reverse:2, qa:1, extra:1};
  const cycle = [];
  Object.keys(weights).forEach(k=>{
    if(groups[k] && groups[k].length){ for(let w=0; w<weights[k]; w++) cycle.push(k); }
  });
  if(!cycle.length) return [];
  const used = {}, out = [];
  let i = 0, guard = 0;
  while(out.length < n && guard++ < 400){
    if(!cycle.some(k=>groups[k].length)) break;
    const k = cycle[i++ % cycle.length];
    const g = groups[k];
    if(!g || !g.length) continue;
    let idx = 0;
    for(let j=0;j<g.length;j++){
      const cid = g[j].cardId;
      if(!cid || !used[cid]){ idx = j; break; }
    }
    const q = g.splice(idx,1)[0];
    if(q.cardId) used[q.cardId] = 1;
    out.push(q);
  }
  return shuffle(out);
}

const ROUND_SIZE = 10;
let quiz = null;

function renderQuizStart(){
  const pool = buildPool();
  const q = store.quiz;
  const acc = q.answered ? Math.round(q.correct/q.answered*100) : 0;
  const scopeLabel = scopeIndex()===null ? "전체 복습" : ("Day " + DAYS_DATA[scopeIndex()].day);
  $("#quizBody").innerHTML = `
    <div class="chips">${dayChipsHTML().replace(/data-scope/g,"data-qscope")}</div>
    <div class="qstart qcenter">
      <div class="qemoji">⚡</div>
      <div class="qtitle">듀오링고처럼 10문제</div>
      <div class="qdesc">${esc(scopeLabel)}에서 ${ROUND_SIZE}문제가 랜덤으로 나와요.<br>맞히면 콤보가 쌓이고, 틀린 문제만 다시 풀 수 있어요.</div>
      <div class="qstats">
        <div class="qstat"><b>${q.answered}</b><span>푼 문제</span></div>
        <div class="qstat"><b>${acc}%</b><span>정답률</span></div>
        <div class="qstat"><b>${q.best||0}</b><span>최고 콤보</span></div>
      </div>
      <button class="btn known" id="startQuiz" style="width:100%">시작하기 · ${Math.min(ROUND_SIZE,pool.length)}문제</button>
      <div class="mixline">한 판 구성 · 뜻 맞히기 3 · 듣기 3 · 말해 보기 2 · 대화 1 · 상황 1</div>
      <div class="scope-note">문제 은행 ${pool.length}개 · Day가 늘면 자동으로 쌓여요</div>
    </div>`;
}
function startRound(list){
  quiz = {list:list, idx:0, score:0, combo:0, max:0, answered:false, sel:null, wrong:[], done:false};
  renderQuestion();
}
function renderQuestion(){
  const q = quiz.list[quiz.idx];
  quiz.answered = false; quiz.sel = null;
  const head = `
    <div class="qtop">
      <span class="qtag">${esc(kindLabel(q))}${q.day?` · Day ${q.day}`:""}</span>
      <span class="qcount">${quiz.idx+1} / ${quiz.list.length}</span>
    </div>
    <div class="qhead">
      <div class="bar"><i style="width:${Math.max(4,(quiz.idx/quiz.list.length*100))}%"></i></div>
      <span class="combo ${quiz.combo>=2?"on":""}" id="combo" style="${quiz.combo>=2?"":"display:none"}">🔥 ${quiz.combo}</span>
    </div>`;

  let main = "";
  if(q.kind === "qa"){
    main = `
      <div class="qsub" style="font-weight:800;color:#8a8a8a">${esc(q.ask)}</div>
      <div class="bubble"><span class="who">${esc(q.speaker||"현지인")}</span>
        <span class="saytxt">🔊 이탈리아어로 말해요</span></div>
      <button class="audio-btn" data-audio="q">🔊 다시 듣기</button>
      <button class="peek" data-peek="1">한국어 뜻 보기</button>
      <div id="peekBox" class="qsub" style="display:none">“${esc(q.qKo||"")}”</div>`;
  }else if(q.kind === "listen"){
    main = `
      <div class="qprompt">🔊 잘 듣고 뜻을 고르세요</div>
      <button class="audio-btn" data-audio="q">🔊 다시 듣기</button>`;
  }else{
    const pc = q.prompt.length > 90 ? "sm" : q.prompt.length > 44 ? "md" : "";
    const langAttr = (q.kind === "meaning" && q.src) ? ` lang="${q.src.type === "en" ? "en" : "it"}"` : "";
    main = `
      ${q.ask ? `<div class="qsub" style="font-weight:800;color:#8a8a8a">${esc(q.ask)}</div>` : ""}
      <div class="qprompt ${pc}"${langAttr}>${esc(q.prompt)}</div>
      ${q.kind === "meaning" ? `<button class="audio-btn" data-audio="q">🔊 ${q.src && q.src.type === "en" ? "영어로 듣기" : "발음 듣기"}</button>` : ""}`;
  }

  const opts = q.options.map((o,i)=>
    `<button class="opt ${o.text.length>46?"long":""}" data-opt="${i}">
       <span class="k">${i+1}</span><span>${esc(o.text)}</span>
     </button>`).join("");

  $("#quizBody").innerHTML = head + main +
    `<div class="opts" id="qOpts">${opts}</div>
     <button class="checkbtn" id="qCheck" disabled>확인</button>
     <div class="fb" id="qFb"></div>`;

  if(q.audio) playQuestionAudio(q);
}
function checkAnswer(){
  if(!quiz || quiz.answered) return;
  if(quiz.sel === null) return;
  const q = quiz.list[quiz.idx];
  const ok = !!q.options[quiz.sel].correct;
  quiz.answered = true;

  document.querySelectorAll("#qOpts .opt").forEach((el,i)=>{
    el.classList.remove("sel");
    if(q.options[i].correct) el.classList.add("ok");
    else if(i === quiz.sel) el.classList.add("no");
  });

  if(ok){
    quiz.score++;
    quiz.combo++;
    quiz.max = Math.max(quiz.max, quiz.combo);
    beep("ok");
  }else{
    quiz.combo = 0;
    quiz.wrong.push(q);
    beep("no");
  }
  store.quiz.answered = (store.quiz.answered||0) + 1;
  if(ok) store.quiz.correct = (store.quiz.correct||0) + 1;
  store.quiz.best = Math.max(store.quiz.best||0, quiz.max);
  save();

  const cEl = $("#combo");
  if(cEl){
    cEl.textContent = "🔥 " + quiz.combo;
    cEl.className = "combo " + (quiz.combo>=2 ? "on" : "");
    cEl.style.display = quiz.combo>=2 ? "" : "none";
  }

  const correctText = q.options.find(o=>o.correct).text;
  const ansId = q.src ? q.src.id : (q.kind === "qa" ? questionAudioId(q) + "a" : "");
  quiz.ansAudio = ansId ? {id:ansId, text:q.src ? q.src.front : correctText, lang:q.src ? cardLang(q.src) : "it-IT"} : null;
  const last = quiz.idx >= quiz.list.length-1;
  const fb = $("#qFb");
  fb.className = "fb show " + (ok?"ok":"no");
  fb.innerHTML = `
    <h4>${ok ? (quiz.combo>=3 ? "정답! 🔥 "+quiz.combo+"연속!" : "정답이에요! 🎉") : "아쉬워요 😅"}</h4>
    ${ok ? "" : `<p><b>정답 · </b>${esc(correctText)}</p>`}
    ${quiz.ansAudio ? `<button class="audio-btn" data-answer-audio="1">🔊 정답 발음 듣기</button>` : ""}
    ${(q.explain||[]).filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join("")}
    <button class="go" id="qNext">${last ? "결과 보기" : "계속"}</button>`;
  const chk = $("#qCheck");
  if(chk){ chk.disabled = true; chk.style.display = "none"; }
  fb.scrollIntoView({behavior:"smooth", block:"nearest"});
}
function nextQuestion(){
  if(!quiz) return;
  if(quiz.idx >= quiz.list.length-1){ renderQuizEnd(); return; }
  quiz.idx++;
  renderQuestion();
}
function renderQuizEnd(){
  const total = quiz.list.length;
  const acc = Math.round(quiz.score/total*100);
  quiz.done = true;
  store.quiz.rounds = (store.quiz.rounds||0) + 1;
  save();
  const wrong = quiz.wrong;
  $("#quizBody").innerHTML = `
    <div class="qstart">
      <div class="qemoji">${acc>=90?"🏆":acc>=70?"🎉":"💪"}</div>
      <div class="bigscore">${quiz.score}<small> / ${total}</small></div>
      <div class="qtitle" style="margin-top:4px">${acc>=90?"거의 완벽해요!":acc>=70?"좋아요, 조금만 더!":"한 번 더 풀면 확실해져요"}</div>
      <div class="qdesc">정답률 ${acc}% · 최고 콤보 🔥 ${quiz.max}</div>
      <div class="qstats">
        <div class="qstat"><b>${quiz.score}</b><span>맞힌 문제</span></div>
        <div class="qstat"><b>${wrong.length}</b><span>틀린 문제</span></div>
        <div class="qstat"><b>${store.quiz.best||0}</b><span>최고 콤보</span></div>
      </div>
      ${wrong.length ? `<div class="wronglist">
        <div class="wt">틀린 문제 ${wrong.length}개</div>
        ${wrong.slice(0,6).map(w=>`
          <div class="wrongitem">
            <div class="q">${esc(w.transcript || w.prompt || (w.kind==="qa" ? "“"+w.qKo+"”" : (w.ask || "문제")))}</div>
            <div class="a">${esc(w.options.find(o=>o.correct).text)}</div>
          </div>`).join("")}
      </div>` : ""}
      ${wrong.length ? `<button class="btn known" id="retryWrong" style="width:100%">🔁 틀린 ${wrong.length}문제만 다시 풀기</button>` : ""}
      <button class="btn ${wrong.length?"ghost":"known"}" id="newRound" style="width:100%">⚡ 새 퀴즈 시작</button>
      <button class="btn ghost" id="toFlash" style="width:100%">🗂 플래시카드로 복습</button>
    </div>`;
}

/* =====================================================================
   7) 이벤트
   ===================================================================== */
function switchView(v){
  const isFlash = v === "flash";
  $("#viewFlash").classList.toggle("active", isFlash);
  $("#viewQuiz").classList.toggle("active", !isFlash);
  $("#tabFlash").classList.toggle("active", isFlash);
  $("#tabQuiz").classList.toggle("active", !isFlash);
  $("#brandDay").textContent = scopeIndex()===null ? "전체" : ("DAY " + DAYS_DATA[scopeIndex()].day);
  if(!isFlash && (!quiz || quiz.done)) renderQuizStart();
  if(isFlash) renderFlash();
}
$("#tabFlash").addEventListener("click", ()=>switchView("flash"));
$("#tabQuiz").addEventListener("click", ()=>switchView("quiz"));
$("#soundBtn").addEventListener("click", ()=>{
  store.sound = !store.sound;
  $("#soundBtn").textContent = store.sound ? "🔊" : "🔇";
  save();
  if(store.sound) beep("ok");
});
$("#soundBtn").textContent = store.sound ? "🔊" : "🔇";

/* --- flash interactions (delegated) --- */
$("#viewFlash").addEventListener("click", e=>{
  const chip = e.target.closest("[data-scope]");
  if(chip){
    store.scope = chip.getAttribute("data-scope");
    save();
    flashIdx = 0; flashDone = false; flipped = false;
    renderFlash();
    return;
  }
  const f = e.target.closest("[data-filter]");
  if(f){
    store.filter = f.getAttribute("data-filter");
    save();
    flashIdx = 0; flashDone = false; flipped = false;
    renderFlash();
    return;
  }
  const say = e.target.closest("[data-say],[data-say-slow]");
  if(say){
    e.stopPropagation();
    const list = filteredCards();
    const c = list[flashIdx];
    if(c){
      const slow = say.hasAttribute("data-say-slow");
      playAudio(c.id, c.front, cardLang(c), slow ? .72 : 1);
    }
    return;
  }
  /* 💬 예시문 듣기 — audio/{id}_ex.mp3 (없으면 TTS 폴백) */
  const exSay = e.target.closest("[data-ex-say],[data-ex-say-slow]");
  if(exSay){
    e.stopPropagation();
    const list = filteredCards();
    const c = list[flashIdx];
    if(c && c.example && c.example.exText){
      const slow = exSay.hasAttribute("data-ex-say-slow");
      playAudio(c.id + "_ex", c.example.exText, cardLang(c), slow ? .72 : 1);
    }
    return;
  }
  const card = e.target.closest("#card");
  if(card){
    flipped = !flipped;
    card.classList.toggle("flipped", flipped);
    return;
  }
  const act = e.target.closest("[data-act]");
  if(!act) return;
  const a = act.getAttribute("data-act");
  if(a === "prev") jumpFlash(-1);
  else if(a === "next") jumpFlash(1);
  else if(a === "again" || a === "known"){
    const list = filteredCards();
    const c = list[flashIdx];
    if(!c) return;
    markCard(c.id, a === "known" ? 1 : -1);
    toast(a === "known" ? "✅ 외웠어요로 표시했어요" : "🔁 다시 볼 카드로 표시했어요");
    if(a === "known") beep("ok");
    const remain = filteredCards();
    if(remain.indexOf(c) !== -1){
      if(flashIdx >= remain.length-1) flashDone = true;
      else flashIdx++;
    }else{
      if(flashIdx >= remain.length) flashDone = true;
    }
    flipped = false;
    renderFlash();
  }
  else if(a === "allcards"){ store.filter = "all"; save(); flashIdx = 0; flashDone = false; renderFlash(); }
  else if(a === "restart"){ flashIdx = 0; flashDone = false; flipped = false; renderFlash(); }
  else if(a === "goquiz"){ switchView("quiz"); }
});

/* --- quiz interactions --- */
$("#viewQuiz").addEventListener("click", e=>{
  const chip = e.target.closest("[data-qscope]");
  if(chip){
    store.scope = chip.getAttribute("data-qscope");
    save();
    renderQuizStart();
    return;
  }
  if(e.target.closest("#startQuiz")){
    const pool = buildPool();
    startRound(pickRound(pool, Math.min(ROUND_SIZE, pool.length)));
    return;
  }
  const opt = e.target.closest("[data-opt]");
  if(opt && quiz && !quiz.answered){
    quiz.sel = Number(opt.getAttribute("data-opt"));
    document.querySelectorAll("#qOpts .opt").forEach((el,i)=>el.classList.toggle("sel", i===quiz.sel));
    const chk = $("#qCheck");
    if(chk) chk.disabled = false;
    return;
  }
  if(e.target.closest("#qCheck")){ checkAnswer(); return; }
  if(e.target.closest("#qNext")){ nextQuestion(); return; }
  if(e.target.closest("[data-answer-audio]")){
    if(quiz && quiz.ansAudio) playAudio(quiz.ansAudio.id, quiz.ansAudio.text, quiz.ansAudio.lang, 1);
    return;
  }
  const aud = e.target.closest("[data-audio]");
  if(aud && quiz){
    const q = quiz.list[quiz.idx];
    if(q.audio) playQuestionAudio(q);
    return;
  }
  const peek = e.target.closest("[data-peek]");
  if(peek){
    const box = $("#peekBox");
    if(box) box.style.display = box.style.display === "none" ? "block" : "none";
    return;
  }
  if(e.target.closest("#retryWrong")){
    startRound(shuffle(quiz.wrong.slice()));
    return;
  }
  if(e.target.closest("#newRound")){
    const pool = buildPool();
    startRound(pickRound(pool, Math.min(ROUND_SIZE, pool.length)));
    return;
  }
  if(e.target.closest("#toFlash")){ switchView("flash"); return; }
});

/* 첫 로드 */
renderFlash();
